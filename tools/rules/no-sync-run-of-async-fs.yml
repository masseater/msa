id: no-sync-run-of-async-fs
language: typescript
severity: error
message: 'Effect''s FileSystem is asynchronous on Node; runSync throws "An asynchronous Effect was executed with Effect.runSync". Yield it inside the caller''s Effect or run it with runPromise.'
rule:
  kind: call_expression
  all:
    - has:
        field: function
        regex: (^|\.)runSync$
    - has:
        field: arguments
        has:
          stopBy: end
          kind: call_expression
          has:
            field: function
            kind: member_expression
            has:
              field: property
              regex: ^(exists|access|readFile|readFileString|readDirectory|readLink|realPath|writeFile|writeFileString|stat|remove|makeDirectory|makeTempDirectory|makeTempDirectoryScoped|makeTempFile|copy|copyFile|rename|chmod|chown|truncate|utimes|symlink|link|open)$
