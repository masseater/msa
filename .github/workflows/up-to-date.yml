name: up-to-date

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  up-to-date:
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  ci-telemetry:
    needs: [up-to-date]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ci-telemetry.sh
            .github/scripts/cloudflare-token.sh
            apps/web/app-name.ts
          sparse-checkout-cone-mode: false
      - if: github.ref == 'refs/heads/main'
        run: .github/scripts/cloudflare-token.sh
      - run: .github/scripts/ci-telemetry.sh
        env:
          GH_TOKEN: ${{ github.token }}
