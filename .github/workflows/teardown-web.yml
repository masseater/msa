name: teardown-web

on:
  push:
    branches: [main]
    paths: [.github/workflows/teardown-web.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  teardown:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/cloudflare-token.sh
            .node-version
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          run-install: false
      - run: .github/scripts/cloudflare-token.sh
      - working-directory: ${{ runner.temp }}
        run: |
          mkdir web && cd web
          cat > package.json <<'JSON'
          {
            "name": "msa-web-teardown",
            "private": true,
            "type": "module",
            "devDependencies": {
              "@alchemy.run/cloudflare": "2.0.0-beta.85",
              "alchemy": "2.0.0-beta.85",
              "effect": "4.1.2"
            }
          }
          JSON
          printf 'allowBuilds:\n  esbuild: true\n  workerd: true\n' > pnpm-workspace.yaml
          cat > alchemy.run.ts <<'TS'
          import { providers, state } from "@alchemy.run/cloudflare";
          import { Stack } from "alchemy";
          import { Effect } from "effect";

          export default Stack("msa", { providers: providers(), state: state() }, Effect.void);
          TS
          vp install
          vp exec alchemy deploy --stage production --yes

  ci-telemetry:
    needs: [teardown]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ci-telemetry.sh
            .github/scripts/cloudflare-token.sh
          sparse-checkout-cone-mode: false
      - if: github.ref == 'refs/heads/main'
        run: .github/scripts/cloudflare-token.sh
      - run: .github/scripts/ci-telemetry.sh
        env:
          GH_TOKEN: ${{ github.token }}
