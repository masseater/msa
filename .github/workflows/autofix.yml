name: autofix

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The verify run that failed
        required: true
        type: string
      branch:
        description: The branch the failed run verified
        required: true
        type: string
      sha:
        description: The commit the failed run verified
        required: true
        type: string

permissions: {}

jobs:
  autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      branch: ${{ steps.target.outputs.branch }}
      sha: ${{ steps.fix.outputs.sha }}
    concurrency:
      group: verify-autofix-${{ inputs.branch }}
    env:
      GH_TOKEN: ${{ github.token }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HEAD_BRANCH: ${{ inputs.branch }}
      HEAD_SHA: ${{ inputs.sha }}
      FAILED_RUN_ID: ${{ inputs.run_id }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      FAILED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.run_id }}
      AUTOFIX_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      CLAUDE_ANSWER: '[.[] | select(.type == "result")] | last | .result // "no answer" | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false
      - run: .github/scripts/claude-preflight.sh
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Check the push credentials and the failed commit
        env:
          AUTOFIX_DEPLOY_KEY: ${{ secrets.AUTOFIX_DEPLOY_KEY }}
        run: |
          if [ -z "$AUTOFIX_DEPLOY_KEY" ]; then
            echo "::error::The AUTOFIX_DEPLOY_KEY secret is empty, so autofix cannot push a fix that runs the pull request checks"
            exit 1
          fi
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq .commit.author.email)" = "$AUTOFIX_EMAIL" ]; then
            echo "::error::verify failed on the fix autofix pushed ($HEAD_SHA); autofix does not retry its own fix"
            exit 1
          fi
      - id: target
        run: |
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HEAD_BRANCH" = "$DEFAULT_BRANCH" ]; then
            branch="claude/fix-verify-$FAILED_RUN_ID"
            git switch -c "$branch"
          else
            branch="$HEAD_BRANCH"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "failed_job=$(gh run view "$FAILED_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs --jq '.jobs[] | select(.name == "verify") | .databaseId')" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "$AUTOFIX_EMAIL"
      - if: steps.target.outputs.stale != 'true'
        name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd
      - if: steps.target.outputs.stale != 'true'
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - if: steps.target.outputs.stale != 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - if: steps.target.outputs.stale != 'true'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          build-warnings: ""
          cache-workspaces: libs/env/daemon
      - if: steps.target.outputs.stale != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - if: steps.target.outputs.stale != 'true'
        name: Hydrate model data
        run: vp run hydrate:model-data
      - if: steps.target.outputs.stale != 'true'
        id: claude
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: github-actions
          prompt: |
            The verify job failed on branch ${{ inputs.branch }} (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.run_id }}).
            The working tree is checked out on branch ${{ steps.target.outputs.branch }}.

            1. Read the failure with `gh run view --job ${{ steps.target.outputs.failed_job }} --log-failed`.
            2. Fix the root cause in the code, following AGENTS.md. Do not change lint or commitlint rules in either direction, add disable directives, or skip checks to make verify pass.
            3. Run `vp run verify` and repeat until it passes.
            4. Commit the fix with a Conventional Commits message whose body explains the cause. Do not push.
          claude_args: >-
            --max-turns 200
            --model claude-opus-5-5
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash"
      - if: failure() && steps.claude.outcome == 'failure'
        run: |
          echo "::error::Claude failed: $(jq -r "$CLAUDE_ANSWER" "$RUNNER_TEMP/claude-execution-output.json")"
      - if: steps.target.outputs.stale != 'true'
        id: fix
        run: |
          if [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ]; then
            echo "::error::Claude did not commit a fix: $(jq -r "$CLAUDE_ANSWER" "$RUNNER_TEMP/claude-execution-output.json")"
            exit 1
          fi
          git bundle create "$RUNNER_TEMP/fix.bundle" "$HEAD_SHA..HEAD"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - if: steps.fix.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autofix-${{ github.run_id }}
          path: ${{ runner.temp }}/fix.bundle
          if-no-files-found: error
          retention-days: 1

  push:
    needs: [autofix]
    if: needs.autofix.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ needs.autofix.outputs.branch }}
      FIX_SHA: ${{ needs.autofix.outputs.sha }}
      HEAD_BRANCH: ${{ inputs.branch }}
      HEAD_SHA: ${{ inputs.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      FAILED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          ssh-key: ${{ secrets.AUTOFIX_DEPLOY_KEY }}
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: autofix-${{ github.run_id }}
          path: ${{ runner.temp }}/autofix
      - run: |
          git fetch --no-tags "$RUNNER_TEMP/autofix/fix.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$FIX_SHA"
          git merge-base --is-ancestor "$HEAD_SHA" "$FIX_SHA"
          git push --no-verify origin "$FIX_SHA:refs/heads/$BRANCH"
          if [ "$BRANCH" != "$HEAD_BRANCH" ]; then
            gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" --draft \
              --title "$(git log -1 --format=%s "$FIX_SHA")" \
              --body "Fixes verify failure $FAILED_RUN_URL" ||
              echo "::warning::Could not open a pull request; open one from $BRANCH manually"
          fi

  ci-telemetry:
    needs: [autofix, push]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ci-telemetry.sh
            apps/web/app-name.ts
          sparse-checkout-cone-mode: false
      - run: .github/scripts/ci-telemetry.sh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
