name: verify

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: vite.config.ts
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          gh auth setup-git
          commits="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE_SHA...$HEAD_SHA" --jq .total_commits)"
          git fetch --no-tags --depth="$((commits + 1))" origin "$HEAD_SHA"
          vp exec commitlint --from "$BEFORE_SHA" --to "$HEAD_SHA" --verbose
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMITS: ${{ github.event.pull_request.commits }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh auth setup-git
          git fetch --no-tags --depth="$((COMMITS + 2))" origin "$GITHUB_SHA"
          vp exec commitlint --from HEAD^1 --to HEAD^2 --verbose
          printf '%s\n' "$PR_TITLE" | vp exec commitlint --verbose
      - if: github.event_name == 'push'
        run: vp run gitleaks
        env:
          GITLEAKS_BASE: ${{ github.event.before }}
      - if: github.event_name == 'pull_request'
        run: vp run gitleaks
        env:
          GITLEAKS_BASE: HEAD^1

  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: vite.config.ts
          ignore-nothing-to-cache: true
      - name: Hydrate model data
        run: vp run hydrate:model-data
      - run: vp run --log grouped checks
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          build-warnings: ""
          cache-workspaces: libs/env/daemon
      - name: Hydrate model data
        run: vp run hydrate:model-data
      - run: vp run --log grouped test-all
        env:
          MSA_TEST_SHARD: ${{ matrix.shard }}/4

  verify:
    needs: [checks, test]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          CHECKS: ${{ needs.checks.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "checks=$CHECKS test=$TEST"
          [ "$CHECKS" = success ] && [ "$TEST" = success ]

  binary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true
      - run: vp run build-binaries linux-x64

  autofix:
    needs: verify
    if: >-
      failure() && github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FAILED_RUN_ID: ${{ github.run_id }}
        run: >-
          gh workflow run autofix.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH"
          -f run_id="$FAILED_RUN_ID" -f branch="$HEAD_BRANCH" -f sha="$HEAD_SHA"

  deploy:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF_NAME" --jq .sha)"
          if [ "$current" = "$HEAD_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.head.outputs.latest == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.head.outputs.latest == 'true'
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - if: steps.head.outputs.latest == 'true'
        run: vp exec alchemy deploy --stage production --yes
        working-directory: apps/web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  ci-telemetry:
    needs: [commits, checks, test, verify, binary, autofix, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ci-telemetry.sh
            apps/web/app-name.ts
          sparse-checkout-cone-mode: false
      - run: .github/scripts/ci-telemetry.sh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
