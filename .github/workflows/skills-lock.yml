name: skills-lock

on:
  push:
    branches: ["renovate/**"]
  workflow_dispatch:
    inputs:
      branch:
        description: The renovate branch whose skills-lock.json to rehash
        required: true
        type: string

permissions: {}

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: masseater/typescript-template/.github/actions/skills-lock@5e507cf2bcea2ef759c07e195185632936b70c33
        with:
          branch: ${{ github.ref_name }}

  rehash:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: skills-lock-${{ inputs.branch }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false
      - uses: masseater/typescript-template/.github/actions/skills-lock@5e507cf2bcea2ef759c07e195185632936b70c33
        with:
          branch: ${{ inputs.branch }}

  ci-telemetry:
    needs: [check, rehash]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ci-telemetry.sh
            .github/scripts/cloudflare-token.sh
          sparse-checkout-cone-mode: false
      - if: github.ref == 'refs/heads/main'
        run: .github/scripts/cloudflare-token.sh
      - run: .github/scripts/ci-telemetry.sh
        env:
          GH_TOKEN: ${{ github.token }}
