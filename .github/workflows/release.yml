name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.0.1)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Checkout the pinned Node.js version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .release-workflow
          persist-credentials: false
          sparse-checkout: |
            .node-version
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .release-workflow/.node-version
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Check the tag against the workspace version
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          workspace_version="$(node -p "require('./apps/coding-agent/package.json').version")"

          if [[ "${version}" != "${workspace_version}" ]]; then
            echo "::error::${RELEASE_TAG} does not match apps/coding-agent/package.json (${workspace_version})."
            exit 1
          fi

      - name: Build release binaries
        run: xvfb-run -a vp run build-binaries
        env:
          MSA_LOCAL_LLM_TESTS: "1"

      - name: Render the Homebrew formula
        run: vp run render-homebrew-formula

      - name: Upload the Homebrew formula
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: homebrew-formula-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          retention-days: 7
          path: .artifacts/homebrew/msa.rb

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          retention-days: 7
          path: |
            .artifacts/binaries/*.tar.gz
            .artifacts/binaries/*.zip
            .artifacts/binaries/SHA256SUMS

  smoke:
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout smoke test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Checkout the pinned Node.js version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .release-workflow
          persist-credentials: false
          sparse-checkout: |
            .node-version
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .release-workflow/.node-version
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Extract the current-platform archive
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          runtime_platform="$(node -p 'process.platform + "-" + process.arch')"
          case "${runtime_platform}" in
            darwin-arm64|darwin-x64|linux-arm64|linux-x64)
              platform="${runtime_platform}"
              archive="release-assets/msa-${platform}.tar.gz"
              root="extracted/msa"
              binary="${root}/msa"
              ;;
            win32-arm64)
              platform="windows-arm64"
              archive="release-assets/msa-${platform}.zip"
              root="extracted"
              binary="${root}/msa.exe"
              ;;
            win32-x64)
              platform="windows-x64"
              archive="release-assets/msa-${platform}.zip"
              root="extracted"
              binary="${root}/msa.exe"
              ;;
            *)
              echo "::error::Unsupported runner platform ${runtime_platform}"
              exit 1
              ;;
          esac

          mkdir -p extracted
          if [[ "${archive}" == *.zip ]]; then
            archive_path="$(cygpath -w "${archive}")"
            destination_path="$(cygpath -w extracted)"
            powershell.exe -NoProfile -NonInteractive -Command \
              "Expand-Archive -LiteralPath '${archive_path}' -DestinationPath '${destination_path}' -Force"
          else
            tar -xf "${archive}" -C extracted
          fi
          echo "binary=${binary}" >> "${GITHUB_OUTPUT}"

      - name: Smoke-test the binary
        shell: bash
        env:
          BINARY: ${{ steps.extract.outputs.binary }}
        run: |
          set -euo pipefail

          "${BINARY}" --help > /dev/null

          reported="$("${BINARY}" --version | tr -d '\r')"
          if [[ "${reported}" != "${RELEASE_TAG#v}" ]]; then
            echo "::error::${BINARY} reports ${reported}, expected ${RELEASE_TAG#v}."
            exit 1
          fi

          vp run smoke-binary-decide "${BINARY}"

  release:
    runs-on: ubuntu-latest
    needs:
      - build
      - smoke
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Write release notes
        run: |
          set -euo pipefail

          cat > release-notes.md <<'NOTES'
          msa release binaries.

          - macOS: msa-darwin-arm64.tar.gz, msa-darwin-x64.tar.gz
          - Linux: msa-linux-x64.tar.gz, msa-linux-arm64.tar.gz
          - Windows: msa-windows-x64.zip, msa-windows-arm64.zip

          Homebrew (macOS/Linux): `brew install masseater/tap/msa`.

          Extract the archive for your platform and run `msa` (`msa.exe` on Windows).
          Checksums are listed in SHA256SUMS.
          NOTES
          printf '\nSee https://github.com/%s#getting-started for setup.\n' "${GITHUB_REPOSITORY}" >> release-notes.md

      - name: Validate the release payload
        run: |
          set -euo pipefail

          cd release-assets

          expected_assets=(
            msa-darwin-arm64.tar.gz
            msa-darwin-x64.tar.gz
            msa-linux-x64.tar.gz
            msa-linux-arm64.tar.gz
            msa-windows-x64.zip
            msa-windows-arm64.zip
            SHA256SUMS
          )
          for asset in "${expected_assets[@]}"; do
            test -f "${asset}"
          done

          sha256sum -c SHA256SUMS

      - name: Create the draft GitHub Release and upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cd release-assets

          release_assets=(
            msa-darwin-arm64.tar.gz
            msa-darwin-x64.tar.gz
            msa-linux-x64.tar.gz
            msa-linux-arm64.tar.gz
            msa-windows-x64.zip
            msa-windows-arm64.zip
            SHA256SUMS
          )

          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "false" ]]; then
            echo "::error::GitHub Release ${RELEASE_TAG} is already published. Refusing to mutate a public release."
            exit 1
          fi
          if [[ "${existing_release}" == "true" ]]; then
            gh release delete "${RELEASE_TAG}" --yes
          fi

          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --draft \
            --title "${RELEASE_TAG}" \
            --notes-file ../release-notes.md \
            "${release_assets[@]}"

          expected_asset_names="$(printf '%s\n' "${release_assets[@]}" | sort)"
          actual_asset_names="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | sort)"
          if [[ "${actual_asset_names}" != "${expected_asset_names}" ]]; then
            echo "::error::Draft GitHub Release asset set does not match the expected files."
            diff -u <(printf '%s\n' "${expected_asset_names}") <(printf '%s\n' "${actual_asset_names}") || true
            exit 1
          fi

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" != "true" ]]; then
            echo "::error::Draft GitHub Release ${RELEASE_TAG} does not exist."
            exit 1
          fi

          gh release edit "${RELEASE_TAG}" --draft=false

  publish-homebrew:
    runs-on: ubuntu-latest
    needs:
      - release
    permissions:
      actions: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout the Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: masseater/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          persist-credentials: true
          path: tap

      - name: Download the Homebrew formula
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: homebrew-formula-${{ env.RELEASE_TAG }}
          path: tap/Formula

      - name: Commit and push the formula
        working-directory: tap
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/msa.rb
          if git diff --cached --quiet; then
            echo "Formula is already up to date."
            exit 0
          fi
          git commit -m "msa ${version}"
          git push

  cleanup-draft-release:
    runs-on: ubuntu-latest
    needs:
      - release
    if: ${{ always() && needs.release.result != 'skipped' && needs.release.result != 'success' }}
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Delete the draft GitHub Release after a failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "true" ]]; then
            gh release delete "${RELEASE_TAG}" --yes
          fi

  ci-telemetry:
    needs: [build, smoke, release, publish-homebrew, cleanup-draft-release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ci-telemetry.sh
            .github/scripts/cloudflare-token.sh
            apps/web/app-name.ts
          sparse-checkout-cone-mode: false
      - if: github.ref == 'refs/heads/main'
        run: .github/scripts/cloudflare-token.sh
      - run: .github/scripts/ci-telemetry.sh
        env:
          GH_TOKEN: ${{ github.token }}
